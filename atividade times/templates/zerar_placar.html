<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');
    :root{
        --bg1:#f5f7ff; --bg2:#eef2ff; --card:#ffffff;
        --accent:#4f46e5; --accent-2:#7c3aed;
    }
    *{box-sizing:border-box}
    body{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
             margin:0;padding:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
             background:linear-gradient(135deg,var(--bg1),var(--bg2));color:#0f172a}
    .container{width:min(640px,92%);background:var(--card);padding:32px;border-radius:12px;
                         box-shadow:0 8px 30px rgba(2,6,23,0.08);text-align:center}
    h1{margin:0 0 8px;font-size:1.25rem;font-weight:600}
    .desc{margin:0 0 20px;color:#475569;font-size:0.95rem}
    .buttons{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
    .btn{appearance:none;border:0;padding:12px 20px;border-radius:10px;font-weight:600;
             cursor:pointer;color:#fff;transition:transform .12s,box-shadow .12s}
    .btn-primary{background:linear-gradient(90deg,var(--accent),var(--accent-2));
                             box-shadow:0 8px 24px rgba(79,70,229,0.16)}
    .btn-primary:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(79,70,229,0.20)}
    .btn:focus{outline:3px solid rgba(99,102,241,0.18);outline-offset:3px}
    </style>

    <div class="container">
        <h1>Placar zerado</h1>
        <p class="desc">Clique no botão abaixo para visualizar o placar.</p>
        <div class="buttons">
            <button type="button" class="btn btn-primary" onclick="window.location.href='mostrar_placar.html'" aria-label="Ir para mostrar placar">
                Mostrar placar
            </button>
        </div>
    </div>
</body>
</html>
